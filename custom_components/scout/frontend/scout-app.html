<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111113;
      --card: #1c1c1e;
      --card2: #2c2c2e;
      --border: #3a3a3c;
      --text: #ffffff;
      --muted: #8e8e93;
      --accent: #2f7cf6;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --purple: #bf5af2;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #main { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .hdr-actions { display: flex; gap: 8px; }

    .btn { background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.danger:hover { border-color: var(--red); color: var(--red); }
    .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .tab.on { background: var(--card2); color: var(--text); border-color: var(--accent); }
    .tab .n { color: var(--muted); margin-left: 4px; }

    .flash { background: rgba(48, 209, 88, 0.12); color: var(--green); border-radius: 10px; padding: 8px 14px; font-size: 13px; margin-bottom: 14px; }
    .flash.err { background: rgba(255, 69, 58, 0.12); color: var(--red); }

    .banner { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--orange); border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; color: var(--muted); }
    .banner strong { color: var(--text); }

    .card { background: var(--card); border-radius: 14px; margin-bottom: 10px; padding: 14px 16px; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 4px 8px; }
    .section-label:first-child { margin-top: 0; }

    /* Deals */
    .deal { display: flex; gap: 14px; }
    .thumb { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--card2); flex-shrink: 0; }
    .deal-body { min-width: 0; flex: 1; }
    .deal-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .deal-title { font-size: 14px; font-weight: 500; line-height: 1.35; }
    .deal-price { font-size: 18px; font-weight: 700; white-space: nowrap; }
    .deal-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .deal-notes { font-size: 13px; margin-top: 6px; line-height: 1.4; }
    .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .flag { font-size: 11px; color: var(--orange); border: 1px solid rgba(255, 159, 10, 0.4); border-radius: 6px; padding: 1px 6px; }
    .deal-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; vertical-align: 1px; white-space: nowrap; }
    .pill.green { background: rgba(48, 209, 88, 0.15); color: var(--green); }
    .pill.orange { background: rgba(255, 159, 10, 0.15); color: var(--orange); }
    .pill.red { background: rgba(255, 69, 58, 0.15); color: var(--red); }
    .pill.blue { background: rgba(47, 124, 246, 0.18); color: var(--accent); }
    .pill.grey { background: var(--card2); color: var(--muted); }
    .pill.purple { background: rgba(191, 90, 242, 0.15); color: var(--purple); }

    /* Watchlist */
    .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .item-name { font-size: 16px; font-weight: 600; }
    .item-name.paused { color: var(--muted); }
    .item-prices { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .stat { background: var(--card2); border-radius: 10px; padding: 8px 10px; }
    .stat .k { font-size: 11px; color: var(--muted); }
    .stat .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .best { font-size: 13px; margin-bottom: 10px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; }
    .link { font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px; color: var(--text); }
    .link:hover { border-color: var(--accent); text-decoration: none; }
    .item-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

    /* Detail */
    .back { margin-bottom: 12px; }
    .chart { width: 100%; height: auto; display: block; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
    .notes-box { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr.dim td { color: var(--muted); }
    td.num { white-space: nowrap; font-weight: 600; }
    .t-title { line-height: 1.35; }
    .t-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
    .modal { background: var(--card); border-radius: 14px; padding: 18px; width: 100%; max-width: 520px; }
    .modal h2 { font-size: 17px; margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
    input, select, textarea { width: 100%; background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .checks label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text); margin: 0; }
    .checks input { width: auto; }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
    .form-err { color: var(--red); font-size: 13px; margin-top: 8px; }

    .status { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; line-height: 1.5; }
    .status.err { color: var(--red); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; line-height: 1.5; }

    @media (max-width: 560px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .thumb { width: 64px; height: 64px; }
      .row3 { grid-template-columns: 1fr; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div id="main"><div class="empty">Loading…</div></div>
  <div id="modal"></div>
  <script src="scout-app.js"></script>
</body>
</html>
